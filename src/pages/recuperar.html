<!--meta {"title":"Recuperar contraseña","description":"Recupera el acceso a tu cuenta de AmiZoo.","path":"/recuperar","noindex":true,"css":["app"],"js":["app","cuenta"]} -->
<section class="acceso" aria-labelledby="t" data-guia="Escribe el correo de tu cuenta. Te enviamos un enlace para crear una contraseña nueva; sirve una sola vez durante 30 minutos." data-guia-titulo="Recuperar contraseña">
  <div class="contenedor acceso__grid acceso__grid--solo">
    <div class="acceso__caja">
      <h1 id="t">Recupera tu contraseña</h1>
      <p class="lead-sm">Te enviamos un enlace al correo para crear una nueva.</p>
      <form data-form="recuperar">
        <label class="campo-f"><span>Correo de tu cuenta</span><input type="email" name="correo" autocomplete="email" inputmode="email" required></label>
        <p class="error-form" data-error role="alert" hidden></p>
        <button class="btn btn-primario btn-grande btn-bloque" type="submit">Enviarme el enlace</button>
      </form>
      <div class="exito" data-exito hidden>{{ico:envelope-simple-open}}<p data-exito-texto></p></div>
      <p class="acceso__enlaces"><a href="/entrar">Volver a entrar</a></p>
    </div>
  </div>
</section>
